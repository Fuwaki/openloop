<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
  <!-- 罐体 -->
  <rect x="4" y="3" width="12" height="14" rx="1"/>
  <!-- 液面 -->
  <line x1="4" y1="11" x2="16" y2="11"/>
  <!-- 液面填充（用线条表示） -->
  <rect x="4.5" y="11" width="11" height="6.5" rx="0.5" fill="currentColor" fill-opacity="0.2"/>
  <!-- 入口管道 -->
  <line x1="10" y1="1" x2="10" y2="3"/>
  <polyline points="8.5,2 10,1 11.5,2"/>
  <!-- 出口管道 -->
  <line x1="10" y1="17" x2="10" y2="19"/>
  <polyline points="8.5,18 10,19 11.5,18"/>
</svg>
